apiVersion: v1
kind: Pod
metadata:
  name: ecal-small-ta-w
  namespace: ai4phys
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 255610
    runAsGroup: 50027
    fsGroup: 50027
  containers:
    - name: mecontainer
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
      volumeMounts:
        - name: nsf
          mountPath: /sciclone/home/jgiroux # Your username
        - name: d10
          mountPath: /sciclone/data10/jgiroux/ # Your username
        - name: scr30
          mountPath: /sciclone/scr30/jgiroux # Your username
        - name: dshm
          mountPath: /dev/shm
      command:
        - /bin/bash
        - -c
        - |
          export PYTHONUNBUFFERED=1
          export OMP_NUM_THREADS=2
          eval "$(conda shell.bash hook)"
          conda activate /sciclone/home/jgiroux/.conda/envs/torch_linux
          torchrun --nproc-per-node=8 /sciclone/home/jgiroux/FM4CAL/train_dist.py --config /sciclone/home/jgiroux/FM4CAL/config/CA_config_dist_copy.json --material_list "G4_W_gamma" "G4_Ta_gamma" --resume /sciclone/data10/jgiroux/ECAL_Cole/ECAL_Models/NoQKNorm_W_Ta_gamma_FixBatchCounting___Jan-24-2026/Epoch01_loss_9.768821.pth > /sciclone/scr30/jgiroux/FM4CAL/TrainLogs/NoQKNorm_Wgamma_Tagamma_1MEvents_35MeVTokenMax_LRMultiStep_RESUME.txt  2>&1
      resources:
        requests:
          cpu: "62" # Scale down by 2 for 4 GPUs
          memory: "500Gi" # Scale down by 2 for 4 GPUs
          nvidia.com/gpu: "8" 
        limits:
          cpu: "62"
          memory: "500Gi"
          nvidia.com/gpu: "8"
      securityContext:
        runAsUser: 255610
        runAsGroup: 50027
  nodeSelector:
    kubernetes.io/hostname: ts4.sciclone.wm.edu
    nvidia.com/gpu.product: "Quadro-RTX-6000"
  volumes:
    - name: nsf
      nfs:
        server: 128.239.56.166 
        path: /sciclone/home/jgiroux # Your username
    - name: d10
      nfs:
        server: 128.239.56.30 
        path: /sciclone/data10/jgiroux # Your username
    - name: scr10
      nfs:
        server: 128.239.56.168
        path: /sciclone/scr10/jgiroux # Your username
    - name: scr30
      nfs:
        server: 128.239.56.174 
        path: /sciclone/scr30/jgiroux # Your username
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi