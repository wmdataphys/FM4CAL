apiVersion: v1
kind: Pod
metadata:
  name: ecal
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 255610
    runAsGroup: 50027
    fsGroup: 50027
  containers:
    - name: mecontainer
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
      volumeMounts:
        - name: nsf
          mountPath: /sciclone/home/jgiroux # Your username
        - name: d10
          mountPath: /sciclone/data10/jgiroux/ # Your username
      command:
        - /bin/bash
        - -c
        - |
          export PYTHONUNBUFFERED=1
          export OMP_NUM_THREADS=2
          eval "$(conda shell.bash hook)"
          conda activate /sciclone/home/jgiroux/.conda/envs/torch_linux
          torchrun --nproc-per-node=2 /sciclone/home/jgiroux/FM4CAL/train_dist.py --config /sciclone/home/jgiroux/FM4CAL/config/CA_config_dist.json > /sciclone/home/jgiroux/FM4CAL/ECAL_Test.txt 2>&1
      resources:
        requests:
          cpu: "20"
          memory: "100Gi"
          nvidia.com/gpu: "2"
        limits:
          cpu: "20"
          memory: "100Gi"
          nvidia.com/gpu: "2"
      securityContext:
        runAsUser: 255610
        runAsGroup: 50027
  nodeSelector:
    kubernetes.io/hostname: gu12.sciclone.wm.edu
    nvidia.com/gpu.product: "NVIDIA-A40"
  volumes:
    - name: nsf
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/jgiroux # Your username
    - name: d10
      nfs:
        server: 128.239.56.30
        path: /sciclone/data10/jgiroux # Your username